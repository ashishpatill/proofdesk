[project]
name = "proofdesk"
version = "0.1.0"
description = "Questionnaire answers drafted from company documents, with every claim checked against its source before shipping."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
